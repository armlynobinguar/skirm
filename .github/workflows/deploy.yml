name: deploy

# Redeploys what changed on staging with scripts/deploy-gcp.sh on every push to main (or by hand
# from the Actions tab, optionally with services=all or a list). It does not wait for ci: tests run before each push (.githooks/pre-push), and the Cloud Build
# image build is the check here; if it fails, nothing is deployed. A separate workflow because ci
# cancels in-progress runs per ref, which would kill a deploy halfway; here deploys queue and never
# cancel. Auth is Workload Identity Federation, no keys (docs/deploy.md, "Deploy from CI").

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: 'auto (only what changed since the running images), all, or a comma list such as web,api'
        default: auto
        required: true

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  staging:
    name: staging (Cloud Run)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    steps:
      # The pushed commit, not whatever main points at by the time a queued deploy starts.
      # Full history: the script diffs each running image's commit against this one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy
        run: scripts/deploy-gcp.sh
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
          PRIVY_APP_ID: ${{ vars.PRIVY_APP_ID }}
          # Custom domain (playskirm.xyz); empty falls back to the run.app URLs.
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          PUBLIC_WS_URL: ${{ vars.PUBLIC_WS_URL }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          # Platform signer account; only read when the <env>-near-ops-key secret exists.
          NEAR_OPS_ACCOUNT: ${{ vars.NEAR_OPS_ACCOUNT }}
          # Staging plays the configured model (the <env>-llm-api-key or <env>-openrouter-api-key
          # secret; OpenRouter and its default model unless the LLM_* variables say otherwise);
          # without a key every agent falls back to the offline greedy brain.
          V2_BRAIN: model
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_PLANNER_MODEL: ${{ vars.LLM_PLANNER_MODEL }}
          LLM_PRICE_INPUT_USD: ${{ vars.LLM_PRICE_INPUT_USD }}
          LLM_PRICE_OUTPUT_USD: ${{ vars.LLM_PRICE_OUTPUT_USD }}
          # Per-agent model catalog (JSON array, .env.example); empty: LLM_MODEL only.
          LLM_MODELS: ${{ vars.LLM_MODELS }}
          # Writer backing contract; empty keeps backing off on staging.
          BACKING_CONTRACT: ${{ vars.BACKING_CONTRACT }}
          # true: agent rentals through market.rent; empty or false: paid in credits.
          NEAR_RENTALS_ONCHAIN: ${{ vars.NEAR_RENTALS_ONCHAIN }}
          # Gasless relay: the key is the <env>-relayer-private-key secret in Secret Manager, never
          # a GitHub secret; the account is required when that secret exists.
          RELAYER_ACCOUNT_ID: ${{ vars.RELAYER_ACCOUNT_ID }}
          RELAYER_FREE_TXS: ${{ vars.RELAYER_FREE_TXS }}
          # Baked into the web image (NEXT_PUBLIC_SAMPLE_MATCH_ID). An image built for a commit is
          # reused, so a new value lands on the next commit deployed with services=web (or all).
          SAMPLE_MATCH_ID: ${{ vars.SAMPLE_MATCH_ID }}
          # Pushes deploy only the pieces whose inputs changed (scripts/deploy-gcp.sh, "Only what changed").
          SERVICES: ${{ inputs.services || 'auto' }}
