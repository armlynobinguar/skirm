<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top bar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pl-tokens.css">
<link rel="stylesheet" href="ds/promptlings/components/bundle.css">
<script src="ds/promptlings/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&amp;family=Atkinson+Hyperlegible+Mono:wght@400;500;600;700&amp;family=Pixelify+Sans:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header style="background: var(--surface); color: var(--ink); font-family: var(--font-sans); box-shadow: inset 0 -1px 0 var(--line);">
  <div style="max-width: 1360px; margin: 0 auto; padding: 8px 24px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; min-height: 56px; box-sizing: border-box;">
    <a href="S02-Home.dc.html" aria-label="Promptlings home" style="display: inline-flex; align-items: center; min-height: 44px; color: var(--ink); text-decoration: none;">
      <x-import component-from-global-scope="Promptlings.Logo" size="{{ 24 }}"></x-import>
    </a>
    <nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 360px; min-width: 0;">
      <sc-for list="{{ nav }}" as="item" hint-placeholder-count="5">
        <sc-if value="{{ item.on }}" hint-placeholder-val="{{ false }}">
          <a href="{{ item.href }}" aria-current="page" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; font: 700 13px/18px var(--font-sans); color: var(--ink); text-decoration: none; box-shadow: inset 0 -3px 0 var(--chalk);">{{ item.label }}</a>
        </sc-if>
        <sc-if value="{{ item.off }}" hint-placeholder-val="{{ true }}">
          <a href="{{ item.href }}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; font: 700 13px/18px var(--font-sans); color: var(--ink-muted); text-decoration: none;">{{ item.label }}</a>
        </sc-if>
      </sc-for>
    </nav>
    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center;">
      <x-import component-from-global-scope="Promptlings.Badge">Testnet</x-import>
      <a href="S15-Credits.dc.html" style="text-decoration: none; color: var(--ink);">
        <x-import component-from-global-scope="Promptlings.CreditsBalance" balance="{{ 946 }}"></x-import>
      </a>
      <a href="S16-Profile.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; font: 700 13px/18px var(--font-sans); color: var(--ink); text-decoration: none;">Tyron</a>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["play","skills","market","pvp","leaderboards","account"],"default":"play"},"$preview":{"width":1440,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'play';
    const items = [
      { id: 'play', label: 'Play', href: 'S02-Home.dc.html' },
      { id: 'skills', label: 'My skills', href: 'S07-My-skills.dc.html' },
      { id: 'market', label: 'Market', href: 'S09-Marketplace.dc.html' },
      { id: 'pvp', label: 'PvP', href: 'S11-PvP-lobby.dc.html' },
      { id: 'leaderboards', label: 'Leaderboards', href: 'S14-Leaderboards.dc.html' }
    ];
    return { nav: items.map((i) => ({ ...i, on: i.id === active, off: i.id !== active })) };
  }
}
</script>
</body>
</html>
