<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S12 Live match, phone, spectator</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pl-tokens.css">
<link rel="stylesheet" href="ds/promptlings/components/bundle.css">
<script src="ds/promptlings/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&amp;family=Atkinson+Hyperlegible+Mono:wght@400;500;600;700&amp;family=Pixelify+Sans:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--ink)}a:hover{color:var(--ink-muted)}
</style>
</helmet>
<div style="min-height: 2000px; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
  <div style="padding: 8px 16px; display: flex; gap: 8px; align-items: center; justify-content: space-between; background: var(--surface); box-shadow: inset 0 -1px 0 var(--line);">
    <a href="S11-PvP-lobby.dc.html" aria-label="Back to PvP" style="display: inline-flex; min-height: 44px; align-items: center;">
      <x-import component-from-global-scope="Promptlings.Logo" size="{{ 24 }}" mark-only="{{ true }}"></x-import>
    </a>
    <span style="display: flex; gap: 8px; align-items: center; flex: 1; min-width: 0;">
      <x-import component-from-global-scope="Promptlings.Badge" icon="play">Live</x-import>
      <span style="font: 700 15px/22px var(--font-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Race · Ember Warehouse</span>
    </span>
    <span style="font: 500 13px/18px var(--font-mono); color: var(--ink-muted);">37</span>
  </div>

  <div style="position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 8px 16px; box-shadow: 0 1px 0 var(--line);">
    <x-import component-from-global-scope="Promptlings.PvPHeader" crew-a="{{ crewA }}" crew-b="{{ crewB }}" elapsed-ms="{{ 42000 }}" tick="{{ 14 }}" mode="Race" ranked="{{ true }}"></x-import>
  </div>

  <main style="padding: 16px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box;">
    <p style="margin: 0; display: flex; gap: 8px; align-items: center; font-size: 13px; line-height: 18px; color: var(--ink-muted);">
      <x-import component-from-global-scope="Promptlings.Icon" name="info" size="{{ 14 }}"></x-import>
      You are spectating. Pink corners mark the critical spot; players in the match do not see them.
    </p>

    <sc-for list="{{ sides }}" as="s" hint-placeholder-count="2">
      <section aria-label="{{ s.aria }}" style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
          <span style="display: flex; gap: 8px; align-items: center; font: 700 15px/22px var(--font-sans);">
            <span style="display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 2px; box-shadow: inset 0 0 0 2px {{ s.color }}; color: {{ s.color }}; font: 700 13px/18px var(--font-mono);">{{ s.letter }}</span>
            {{ s.title }}
          </span>
          <span style="font: 500 11px/14px var(--font-mono); color: var(--ink-muted);">{{ s.progress }}</span>
        </div>
        <div style="display: flex; justify-content: center;">
          <x-import component-from-global-scope="Promptlings.MapGrid" rows="{{ s.rows }}" tile-size="{{ 16 }}" agents="{{ s.agents }}" marks="{{ marks }}" label="{{ s.label }}"></x-import>
        </div>
        <div style="background: var(--surface); border-radius: 6px; box-shadow: var(--elev-1); padding: 12px;">
          <x-import component-from-global-scope="Promptlings.ConfidenceBar" options="{{ s.conf }}" agent-name="{{ s.agent }}" crew="{{ s.crew }}" tick="{{ 15 }}" max="{{ 3 }}"></x-import>
          <div style="display: flex; gap: 12px; margin-top: 8px; font: 500 11px/14px var(--font-mono); color: var(--ink-muted);">
            <span>{{ s.ringText }}</span><span>Waited 0</span><span>Timed out 0</span>
          </div>
        </div>
      </section>
    </sc-for>

    <x-import component-from-global-scope="Promptlings.TileLegend" kinds="{{ legend }}" compact="{{ true }}"></x-import>

    <section aria-labelledby="feed" style="background: var(--surface); border-radius: 6px; box-shadow: var(--elev-1); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;">
      <h2 id="feed" style="margin: 0; font: 700 17px/24px var(--font-sans);">Events</h2>
      <ul style="margin: 0; padding: 0; list-style: none;">
        <sc-for list="{{ feed }}" as="e" hint-placeholder-count="4">
          <li style="display: grid; grid-template-columns: 44px 16px 1fr; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 18px;">
            <span style="font-family: var(--font-mono); color: var(--ink-muted);">T {{ e.t }}</span>
            <span style="font: 700 13px/18px var(--font-mono); color: {{ e.color }};">{{ e.crew }}</span>
            <span>{{ e.text }}</span>
          </li>
        </sc-for>
      </ul>
    </section>
    <x-import component-from-global-scope="Promptlings.Button" block="{{ true }}" size="lg">Share match</x-import>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2000}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      crewA: { name: 'Tyron · Rook', elo: 1248, agents: 1, progress: 'Key 0/1' },
      crewB: { name: 'reefwalker · Kite', elo: 1231, agents: 1, progress: 'Key 0/1' },
      marks: [[7, 2]],
      sides: [
        { aria: 'Crew A board', letter: 'A', crew: 'a', color: 'var(--crew-a)', title: 'Tyron · Rook', agent: 'Rook', progress: 'crate pushed T 8', ringText: 'Picked in 0.4 s',
          rows: ['###############','#######c#######','#^^^^^^.,,,,,,#','#######.###.#,#','#...........#,#','#...........#,#','#..........E#*#','###############'],
          agents: [{ id: 'a', x: 13, y: 2, crew: 'a' }], label: 'Crew A board at step 14: crate pushed north, fire stopped at the gap',
          conf: [{ action: 'move S', p: 0.91 }, { action: 'move W', p: 0.05 }, { action: 'wait', p: 0.04 }] },
        { aria: 'Crew B board', letter: 'B', crew: 'b', color: 'var(--crew-b)', title: 'reefwalker · Kite', agent: 'Kite', progress: 'fire past (7,2)', ringText: 'Picking · 1.5 of 2.5 s',
          rows: ['###############','#######.#######','#^^^^^^^^,,,,,#','#######.###.#,#','#...........#,#','#...........#,#','#..........E#*#','###############'],
          agents: [{ id: 'b', x: 13, y: 2, crew: 'b' }], label: 'Crew B board at step 14: crate burned, fire at (8,2)',
          conf: [{ action: 'move S', p: 0.86 }, { action: 'wait', p: 0.08 }, { action: 'move W', p: 0.06 }] }
      ],
      legend: ['wall', 'fire', 'grass', 'crate', 'gem', 'exit', 'agent', 'mark'],
      feed: [
        { t: '14', crew: 'B', color: 'var(--crew-b)', text: 'Fire spread to (8,2)' },
        { t: '12', crew: 'B', color: 'var(--crew-b)', text: 'Fire burned the crate at (7,2)' },
        { t: '8', crew: 'A', color: 'var(--crew-a)', text: 'Rook pushed the crate north' },
        { t: '1', crew: '', color: 'var(--ink-muted)', text: 'Match started' }
      ]
    };
  }
}
</script>
</body>
</html>
