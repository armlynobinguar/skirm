<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S14 Leaderboards</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pl-tokens.css">
<link rel="stylesheet" href="ds/promptlings/components/bundle.css">
<script src="ds/promptlings/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&amp;family=Atkinson+Hyperlegible+Mono:wght@400;500;600;700&amp;family=Pixelify+Sans:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--ink)}a:hover{color:var(--ink-muted)}
</style>
</helmet>
<div style="min-height: 1240px; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
  <dc-import name="TopBar" active="leaderboards" hint-size="100%,72px"></dc-import>
  <main style="max-width: 1360px; margin: 0 auto; padding: 32px 24px 48px; display: flex; flex-direction: column; gap: 24px; box-sizing: border-box;">
    <h1 style="margin: 0; font: 600 32px/36px var(--font-display);">Leaderboards</h1>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end;">
      <div style="flex: 1 1 auto; min-width: 0;">
        <x-import component-from-global-scope="Promptlings.Tabs" tabs="{{ tabs }}" value="map" label="Leaderboard"></x-import>
      </div>
      <x-import component-from-global-scope="Promptlings.ScopeChip" scope="Stretch"></x-import>
      <span style="font-size: 13px; line-height: 18px; color: var(--ink-muted);">Season pool tab</span>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start;">
      <section aria-labelledby="permap" style="flex: 999 1 640px; min-width: 0; background: var(--surface); border-radius: 6px; box-shadow: var(--elev-1); padding: 16px; display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between;">
          <h2 id="permap" style="margin: 0; font: 600 24px/28px var(--font-display);">Flood Gate</h2>
          <label style="display: flex; flex-direction: column; gap: 6px; font: 700 13px/18px var(--font-sans);">
            Map
            <select style="min-height: 40px; min-width: 220px; padding: 0 8px; background: var(--surface-sunken); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 4px; font: 400 15px/22px var(--font-sans);">
              <option>Flood Gate</option>
              <option>Ember Warehouse</option>
              <option>Magma Mine</option>
            </select>
          </label>
        </div>
        <x-import component-from-global-scope="Promptlings.ScoreHistogram" bins="{{ bins }}" min="{{ 0 }}" max="{{ 2500 }}" your-score="{{ 2300 }}" caption="Score, all crew sizes · 122 cleared runs" height="{{ 80 }}"></x-import>
        <x-import component-from-global-scope="Promptlings.Tabs" tabs="{{ crewTabs }}" value="1" label="Crew size"></x-import>
        <div role="table" aria-label="Flood Gate, 1 agent, top 10" style="display: flex; flex-direction: column;">
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="10">
            <div style="display: flex; gap: 8px; align-items: center;">
              <div style="flex: 1; min-width: 0;">
                <x-import component-from-global-scope="Promptlings.LeaderboardRow" row="{{ r.row }}" you="{{ r.you }}"></x-import>
              </div>
              <a href="S05-Run-viewer.dc.html" aria-label="{{ r.watch }}" style="display: inline-flex; gap: 6px; align-items: center; min-height: 44px; padding: 0 8px; font: 700 13px/18px var(--font-sans);">
                <x-import component-from-global-scope="Promptlings.Icon" name="replay" size="{{ 14 }}"></x-import>
                Replay
              </a>
            </div>
          </sc-for>
        </div>
      </section>

      <aside aria-labelledby="ladder" style="flex: 1 1 380px; min-width: 0; background: var(--surface); border-radius: 6px; box-shadow: var(--elev-1); padding: 16px; display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px;">
          <h2 id="ladder" style="margin: 0; font: 600 24px/28px var(--font-display);">Race ladder</h2>
          <span style="font: 500 13px/18px var(--font-mono); color: var(--ink-muted);">Elo per agent</span>
        </div>
        <div style="overflow-x: auto;">
          <table style="width: 100%; border-collapse: collapse; font-size: 15px; line-height: 22px;">
            <thead>
              <tr style="text-align: left; font: 700 13px/18px var(--font-sans); color: var(--ink-muted);">
                <th scope="col" style="padding: 6px 4px; border-bottom: 1px solid var(--line);">#</th>
                <th scope="col" style="padding: 6px 4px; border-bottom: 1px solid var(--line);">Agent</th>
                <th scope="col" style="padding: 6px 4px; border-bottom: 1px solid var(--line);">Owner</th>
                <th scope="col" style="padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: right;">Elo</th>
                <th scope="col" style="padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: right;">W–L</th>
              </tr>
            </thead>
            <tbody>
              <sc-for list="{{ ladder }}" as="l" hint-placeholder-count="7">
                <tr style="background: {{ l.bg }};">
                  <td style="padding: 8px 4px; border-bottom: 1px solid var(--line); font-family: var(--font-mono); color: var(--ink-muted);">{{ l.rank }}</td>
                  <td style="padding: 8px 4px; border-bottom: 1px solid var(--line);">
                    <span style="display: flex; gap: 6px; align-items: center; font-weight: 700;">
                      <x-import component-from-global-scope="Promptlings.AgentAvatar" size="{{ 18 }}" label="{{ l.agent }}"></x-import>{{ l.agent }}
                    </span>
                  </td>
                  <td style="padding: 8px 4px; border-bottom: 1px solid var(--line);">{{ l.owner }}</td>
                  <td style="padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: right; font-family: var(--font-mono);">{{ l.elo }}</td>
                  <td style="padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: right; font-family: var(--font-mono);">{{ l.wl }}</td>
                </tr>
              </sc-for>
            </tbody>
          </table>
        </div>
        <p style="margin: 0; font-size: 13px; line-height: 18px; color: var(--ink-muted);">Every agent starts at 1,200. Ranked play is free of stakes.</p>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const top = [
      ['tidecaller', 27, 2325], ['reefwalker', 27, 2300], ['Tyron', 27, 2300], ['mossbyte', 28, 2275], ['kiln_k', 28, 2275],
      ['brine.near', 29, 2250], ['saltmarsh', 29, 2250], ['quayside', 30, 2225], ['lowtide', 30, 2225], ['pebble', 30, 2225]
    ];
    const ladder = [
      ['1', 'Skiff', 'tidecaller', '1,412', '18–4'], ['2', 'Cinder', 'kiln_k', '1,355', '14–6'], ['3', 'Ripple', 'lowtide', '1,318', '12–7'],
      ['4', 'Marl', 'mossbyte', '1,290', '9–6'], ['5', 'Kelp', 'saltmarsh', '1,271', '8–5'], ['6', 'Rook', 'Tyron · you', '1,263', '6–3'], ['7', 'Kite', 'reefwalker', '1,216', '7–8']
    ];
    return {
      tabs: [{ id: 'ladder', label: 'Race ladder' }, { id: 'map', label: 'Per map' }, { id: 'season', label: 'Season pool', disabled: true }],
      crewTabs: [{ id: '1', label: '1 agent', count: 65 }, { id: '2', label: '2 agents', count: 41 }, { id: '3', label: '3 agents', count: 16 }],
      bins: [4, 6, 9, 14, 31, 12, 8, 11, 19, 8],
      rows: top.map((t, i) => ({ row: { rank: i + 1, player: t[0], agents: 1, steps: t[1], score: t[2] }, you: t[0] === 'Tyron', watch: 'Replay of ' + t[0] })),
      ladder: ladder.map((l) => ({ rank: l[0], agent: l[1], owner: l[2], elo: l[3], wl: l[4], bg: l[1] === 'Rook' ? 'var(--chalk-soft)' : 'transparent' }))
    };
  }
}
</script>
</body>
</html>
