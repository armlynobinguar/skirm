<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>M03 Tutorial coach mark</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pl-tokens.css">
<link rel="stylesheet" href="ds/promptlings/components/bundle.css">
<script src="ds/promptlings/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&amp;family=Atkinson+Hyperlegible+Mono:wght@400;500;600;700&amp;family=Pixelify+Sans:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--ink)}a:hover{color:var(--ink-muted)}
</style>
</helmet>
<div style="position: relative; min-height: 900px; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
  <dc-import name="TopBar" active="play" hint-size="100%,72px"></dc-import>
  <main style="max-width: 1360px; margin: 0 auto; padding: 24px 24px 48px; display: flex; flex-direction: column; gap: 24px; box-sizing: border-box;">
    <div style="display: flex; gap: 12px; align-items: center;">
      <h1 style="margin: 0; font: 600 32px/36px var(--font-display);">Flood Gate</h1>
      <x-import component-from-global-scope="Promptlings.Badge">Tutorial · 3 free runs left</x-import>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start;">
      <x-import component-from-global-scope="Promptlings.MapGrid" rows="{{ rows }}" tile-size="{{ 32 }}" animate="{{ false }}" label="Flood Gate before the tutorial run"></x-import>
      <div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 16px;">
        <div style="position: relative; z-index: 3; align-self: flex-start; background: var(--surface); border-radius: 6px; padding: 16px; box-shadow: var(--focus-ring);">
          <div style="font: 700 12px/16px var(--font-sans); color: var(--ink-muted); margin-bottom: 8px;">Tags in play</div>
          <div style="display: flex; flex-wrap: wrap; gap: 4px;">
            <x-import component-from-global-scope="Promptlings.TagChip" tag="spreads"></x-import>
            <x-import component-from-global-scope="Promptlings.TagChip" tag="liquid"></x-import>
            <x-import component-from-global-scope="Promptlings.TagChip" tag="collectible"></x-import>
          </div>
        </div>

        <div role="dialog" aria-labelledby="coach-title" style="position: relative; z-index: 3; max-width: 420px; background: var(--surface-raised); border-radius: 6px; box-shadow: var(--elev-3); padding: 20px; display: flex; flex-direction: column; gap: 12px;">
          <span aria-hidden="true" style="position: absolute; top: -8px; left: 32px; width: 16px; height: 16px; background: var(--surface-raised); transform: rotate(45deg);"></span>
          <span style="font: 500 13px/18px var(--font-mono); color: var(--focus);">1 of 5</span>
          <h2 id="coach-title" style="margin: 0; font: 600 24px/28px var(--font-display);">Read the tags first</h2>
          <p style="margin: 0; color: var(--ink-muted);">Water <code style="font-family: var(--font-mono); color: var(--ink);">spreads</code> every 2 steps, and agents cannot walk into <code style="font-family: var(--font-mono); color: var(--ink);">liquid</code>. Skills are written against tags, so a skill for <code style="font-family: var(--font-mono); color: var(--ink);">spreads</code> works on water, lava and fire.</p>
          <ol aria-label="Tutorial steps" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13px; line-height: 18px;">
            <sc-for list="{{ marks }}" as="m" hint-placeholder-count="5">
              <li style="display: flex; gap: 8px; align-items: center; color: {{ m.color }};">
                <span style="font: 600 11px/14px var(--font-mono); min-width: 16px; text-align: center; padding: 1px 2px; box-shadow: inset 0 0 0 1px {{ m.color }};">{{ m.n }}</span>
                {{ m.label }}
              </li>
            </sc-for>
          </ol>
          <div style="display: flex; justify-content: space-between; gap: 8px; align-items: center; padding-top: 4px;">
            <x-import component-from-global-scope="Promptlings.Button" variant="ghost">Skip tutorial</x-import>
            <x-import component-from-global-scope="Promptlings.Button" variant="primary" icon-right="step_fwd">Next</x-import>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 2; background: #0a0d0cb3;"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const labels = ['Read the tags', 'Give Rook the Builder unlock', 'Equip Flood Warden', 'Deploy 1 agent, free', 'Watch the plan and the score'];
    return {
      rows: ['###############','#~~~~~~~~~~~~~#','#######.#######','#.....#.#.....#','#.*...#.#...*.#','#.............#','#.............#','#.*....0......#','###############'],
      marks: labels.map((label, i) => ({ n: String(i + 1), label, color: i === 0 ? 'var(--ink)' : 'var(--ink-muted)' }))
    };
  }
}
</script>
</body>
</html>
