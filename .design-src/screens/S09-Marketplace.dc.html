<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S09 Marketplace</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pl-tokens.css">
<link rel="stylesheet" href="ds/promptlings/components/bundle.css">
<script src="ds/promptlings/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&amp;family=Atkinson+Hyperlegible+Mono:wght@400;500;600;700&amp;family=Pixelify+Sans:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--ink)}a:hover{color:var(--ink-muted)}
</style>
</helmet>
<div class="pl-paper" style="min-height: 1320px; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
  <dc-import name="TopBar" active="market" hint-size="100%,72px"></dc-import>
  <main style="max-width: 1360px; margin: 0 auto; padding: 32px 24px 48px; display: flex; flex-direction: column; gap: 24px; box-sizing: border-box;">
    <section style="display: flex; flex-direction: column; gap: 8px;">
      <h1 style="margin: 0; font: 600 32px/36px var(--font-display);">Market</h1>
      <p style="margin: 0; color: var(--ink-muted); max-width: 720px;">Find a skill by proof. Every public run records how often each skill clears maps with each tag. You buy the right to use a skill, never its text.</p>
    </section>

    <section aria-label="Filters" style="background: var(--surface); border-radius: 6px; box-shadow: var(--elev-1); padding: 16px; display: flex; flex-direction: column; gap: 16px;">
      <div role="group" aria-label="Mechanic tag" style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center;">
        <span style="font: 700 13px/18px var(--font-sans); margin-right: 8px;">Handles</span>
        <sc-for list="{{ tags }}" as="t" hint-placeholder-count="10">
          <sc-if value="{{ t.on }}" hint-placeholder-val="{{ false }}">
            <button type="button" aria-pressed="true" style="min-height: 36px; padding: 0 12px; border-radius: 2px; border: 1px solid var(--chalk); background: var(--chalk); color: var(--on-chalk); font: 500 13px/18px var(--font-mono); cursor: pointer;">{{ t.tag }}</button>
          </sc-if>
          <sc-if value="{{ t.off }}" hint-placeholder-val="{{ true }}">
            <button type="button" aria-pressed="false" style="min-height: 36px; padding: 0 12px; border-radius: 2px; border: 1px solid var(--line-strong); background: transparent; color: var(--ink); font: 500 13px/18px var(--font-mono); cursor: pointer;">{{ t.tag }}</button>
          </sc-if>
        </sc-for>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end;">
        <label style="display: flex; flex-direction: column; gap: 6px; font: 700 13px/18px var(--font-sans);">
          Fits map
          <select style="min-height: 40px; min-width: 220px; padding: 0 8px; background: var(--surface-sunken); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 4px; font: 400 15px/22px var(--font-sans);">
            <option>Flood Gate</option>
            <option>Ember Warehouse</option>
            <option>Magma Mine</option>
            <option>Any map</option>
          </select>
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font: 700 13px/18px var(--font-sans);">
          Sort
          <select style="min-height: 40px; min-width: 260px; padding: 0 8px; background: var(--surface-sunken); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 4px; font: 400 15px/22px var(--font-sans);">
            <option>Clear rate on spreads</option>
            <option>Average score</option>
            <option>Price, low to high</option>
            <option>Newest</option>
          </select>
        </label>
        <div style="flex: 1 1 260px; min-width: 0;">
          <x-import component-from-global-scope="Promptlings.TextField" label="Search" prefix="skill" placeholder="Skill or creator"></x-import>
        </div>
      </div>
    </section>

    <p style="margin: 0; font: 500 13px/18px var(--font-mono); color: var(--ink-muted);">5 skills handle spreads and can act on Flood Gate</p>

    <section aria-label="Skills" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px;">
      <sc-for list="{{ skills }}" as="s" hint-placeholder-count="5">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between;">
            <span style="font: 500 13px/18px var(--font-mono);">{{ s.proof }}</span>
            <sc-if value="{{ s.badge }}" hint-placeholder-val="{{ false }}">
              <x-import component-from-global-scope="Promptlings.Badge" tone="you" icon="{{ false }}">{{ s.badge }}</x-import>
            </sc-if>
          </div>
          <x-import component-from-global-scope="Promptlings.SkillCard" skill="{{ s.skill }}" owned="{{ s.owned }}" map-unlocks="{{ mapUnlocks }}" on-buy="{{ s.buy }}"></x-import>
          <a href="S10-Skill-detail.dc.html" style="align-self: flex-start; display: inline-flex; min-height: 44px; align-items: center; font: 700 13px/18px var(--font-sans);">{{ s.open }}</a>
        </div>
      </sc-for>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1320}}'>
class Component extends DCLogic {
  renderVals() {
    const allTags = ['spreads', 'liquid', 'damages', 'solid', 'blocks', 'pushable', 'breakable', 'flammable', 'collectible', 'goal'];
    const noop = () => {};
    return {
      mapUnlocks: ['Builder'],
      tags: allTags.map((tag) => ({ tag, on: tag === 'spreads', off: tag !== 'spreads' })),
      skills: [
        { open: 'Open Dam First', proof: '82% of 45 runs on spreads maps', badge: '', owned: false, buy: noop,
          skill: { name: 'Dam First', creator: 'tidecaller', unlocks: ['Builder'], tags: ['spreads', 'liquid'], clearRates: [{ tag: 'spreads', cleared: 37, runs: 45 }, { tag: 'liquid', cleared: 37, runs: 45 }], price: 1.5, royalty: 5 } },
        { open: 'Open Flood Warden', proof: '79% of 52 runs on spreads maps', badge: 'Official · starter', owned: true, buy: undefined,
          skill: { name: 'Flood Warden', creator: 'Promptlings', unlocks: ['Builder'], tags: ['spreads', 'liquid'], clearRates: [{ tag: 'spreads', cleared: 41, runs: 52 }] } },
        { open: 'Open Firebreak First', proof: '74% of 19 runs on spreads maps', badge: 'Yours', owned: false, buy: undefined,
          skill: { name: 'Firebreak First', creator: 'Tyron', unlocks: [], tags: ['spreads', 'flammable', 'pushable'], clearRates: [{ tag: 'spreads', cleared: 14, runs: 19 }, { tag: 'flammable', cleared: 12, runs: 13 }], price: 1.2, royalty: 5 } },
        { open: 'Open Lava Plug', proof: '64% of 14 runs on spreads maps', badge: '', owned: false, buy: noop,
          skill: { name: 'Lava Plug', creator: 'kiln_k', unlocks: ['Builder'], tags: ['spreads', 'liquid', 'damages'], clearRates: [{ tag: 'spreads', cleared: 9, runs: 14 }, { tag: 'damages', cleared: 4, runs: 9 }], price: 0.8, royalty: 7 } },
        { open: 'Open Slow Water', proof: 'Not rated yet: 4 of 5 public runs', badge: '', owned: false, buy: noop,
          skill: { name: 'Slow Water', creator: 'brine.near', unlocks: [], tags: ['spreads', 'liquid'], clearRates: [{ tag: 'spreads', cleared: 3, runs: 4 }], price: 0.3, royalty: 5 } }
      ]
    };
  }
}
</script>
</body>
</html>
