# Builds and pushes the web image on Cloud Build (docs/deploy.md, Staging). NEXT_PUBLIC_* values are
# inlined into the browser bundle, so the image is built per environment:
#
#   gcloud builds submit --config=docker/cloudbuild.web.yaml --substitutions=\
#   _REG=us-central1-docker.pkg.dev/<project>/skirm,_TAG=<tag>,_IMAGE=web-staging,\
#   _API_URL=https://...,_WS_URL=wss://.../ws,_PRIVY_APP_ID=<app id> .
#
# scripts/deploy-gcp.sh runs it with the environment's URLs.
substitutions:
  _REG: ''
  _TAG: ''
  _IMAGE: web
  _API_URL: ''
  _WS_URL: ''
  _AUTH_MODE: privy
  _PRIVY_APP_ID: ''
  _NEAR_NETWORK: testnet
  # A ranked, recorded match for /verify's "Try a sample match"; empty hides the button.
  _SAMPLE_MATCH_ID: ''
options:
  env: ['DOCKER_BUILDKIT=1']
  machineType: E2_HIGHCPU_8
timeout: 3600s
steps:
  - id: web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - docker/node.Dockerfile
      - --build-arg
      - APP=web
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg
      - NEXT_PUBLIC_WS_URL=${_WS_URL}
      - --build-arg
      - NEXT_PUBLIC_AUTH_MODE=${_AUTH_MODE}
      - --build-arg
      - NEXT_PUBLIC_PRIVY_APP_ID=${_PRIVY_APP_ID}
      - --build-arg
      - NEXT_PUBLIC_NEAR_NETWORK=${_NEAR_NETWORK}
      - --build-arg
      - NEXT_PUBLIC_SAMPLE_MATCH_ID=${_SAMPLE_MATCH_ID}
      - -t
      - ${_REG}/${_IMAGE}:${_TAG}
      - .
images:
  - '${_REG}/${_IMAGE}:${_TAG}'
