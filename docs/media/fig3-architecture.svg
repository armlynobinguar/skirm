<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1000" height="400" fill="#ffffff"/>

  <!-- client -->
  <rect x="16" y="110" width="150" height="80" rx="5" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="28" y="134" font-size="13" font-weight="bold">Web client</text>
  <text x="28" y="154" font-size="11" fill="#555">Next.js · 3D arena</text>
  <text x="28" y="170" font-size="11" fill="#555">NEAR wallet (NEP-413)</text>

  <!-- services region -->
  <rect x="200" y="20" width="440" height="270" rx="6" fill="#f6f8fb" stroke="#c9d3e0" stroke-dasharray="5 4"/>
  <text x="214" y="42" font-size="13" fill="#4a5a70" font-weight="bold" letter-spacing="1">SERVICES (OFFCHAIN)</text>

  <rect x="220" y="60" width="180" height="70" rx="5" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="232" y="82" font-size="13" font-weight="bold">API</text>
  <text x="232" y="100" font-size="11" fill="#555">accounts, skills, market,</text>
  <text x="232" y="115" font-size="11" fill="#555">credits ledger · REST</text>

  <rect x="220" y="160" width="180" height="80" rx="5" fill="#eef4fb" stroke="#4a6fa5" stroke-width="1.4"/>
  <text x="232" y="182" font-size="13" font-weight="bold" fill="#2c4a75">Realtime</text>
  <text x="232" y="200" font-size="11" fill="#555">matchmaking, tick loop,</text>
  <text x="232" y="215" font-size="11" fill="#555">policies, talk filter,</text>
  <text x="232" y="230" font-size="11" fill="#555">settlement · WebSocket</text>

  <rect x="440" y="60" width="180" height="70" rx="5" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <text x="452" y="82" font-size="13" font-weight="bold">Worker</text>
  <text x="452" y="100" font-size="11" fill="#555">benchmarks, trials,</text>
  <text x="452" y="115" font-size="11" fill="#555">seasons, registry writes</text>

  <rect x="440" y="160" width="85" height="80" rx="5" fill="#f4f4f4" stroke="#333"/>
  <text x="482" y="196" font-size="12" font-weight="bold" text-anchor="middle">Postgres</text>
  <text x="482" y="213" font-size="10" fill="#666" text-anchor="middle">+ skill vault</text>
  <rect x="535" y="160" width="85" height="80" rx="5" fill="#f4f4f4" stroke="#333"/>
  <text x="577" y="196" font-size="12" font-weight="bold" text-anchor="middle">Redis</text>
  <text x="577" y="213" font-size="10" fill="#666" text-anchor="middle">queues · pub/sub</text>

  <!-- LLM -->
  <rect x="680" y="230" width="150" height="60" rx="5" fill="#fff" stroke="#333" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="692" y="252" font-size="13" font-weight="bold">LLM provider</text>
  <text x="692" y="270" font-size="11" fill="#555">any OpenAI-compatible</text>
  <rect x="850" y="230" width="134" height="60" rx="5" fill="#fff" stroke="#333" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="862" y="252" font-size="13" font-weight="bold">External agent</text>
  <text x="862" y="270" font-size="11" fill="#555">webhook · MCP</text>

  <!-- NEAR -->
  <rect x="680" y="20" width="304" height="180" rx="6" fill="#f7f5fc" stroke="#d3cbe8" stroke-dasharray="5 4"/>
  <text x="694" y="42" font-size="13" fill="#5b4a85" font-weight="bold" letter-spacing="1">NEAR (ONCHAIN)</text>
  <g font-size="11.5">
    <rect x="696" y="56" width="132" height="38" rx="4" fill="#fff" stroke="#5b4a85"/><text x="708" y="80"><tspan font-weight="bold">skills</tspan> NFT</text>
    <rect x="838" y="56" width="132" height="38" rx="4" fill="#fff" stroke="#5b4a85"/><text x="850" y="80"><tspan font-weight="bold">market</tspan> royalties</text>
    <rect x="696" y="102" width="132" height="38" rx="4" fill="#fff" stroke="#5b4a85"/><text x="708" y="126"><tspan font-weight="bold">registry</tspan> results</text>
    <rect x="838" y="102" width="132" height="38" rx="4" fill="#fff" stroke="#5b4a85"/><text x="850" y="126"><tspan font-weight="bold">deposits</tspan> credits</text>
    <rect x="696" y="148" width="132" height="38" rx="4" fill="#fff" stroke="#5b4a85"/><text x="708" y="172"><tspan font-weight="bold">seasons</tspan> prizes</text>
  </g>

  <!-- arrows -->
  <g stroke="#333" stroke-width="1.3" fill="none" marker-end="url(#ar)">
    <path d="M166,135 L190,135 L190,95 L218,95"/>
    <path d="M166,165 L190,165 L190,200 L218,200"/>
    <line x1="400" y1="95" x2="438" y2="95"/>
    <line x1="400" y1="200" x2="438" y2="200"/>
    <path d="M400,225 C 600,300 660,280 678,262"/>
    <path d="M400,232 C 650,340 900,330 916,292"/>
    <line x1="620" y1="95" x2="694" y2="120"/>
    <path d="M90,110 L90,9 L960,9 L960,54"/>
  </g>
  <rect x="352" y="2" width="226" height="14" fill="#ffffff"/><text x="465" y="13" font-size="10.5" fill="#666" font-style="italic" text-anchor="middle">wallet signs: top-up, buy, list, rent</text>

  <!-- caption -->
  <text x="16" y="342" font-size="13.5" fill="#222"><tspan font-weight="bold">Figure 3.</tspan> System architecture. Matches run offchain in a realtime service that queries any OpenAI-compatible</text>
  <text x="16" y="362" font-size="13.5" fill="#222">model or an external agent. Skill ownership, trades, ranked results and prize pools settle on five NEAR contracts;</text>
  <text x="16" y="382" font-size="13.5" fill="#222">the player's wallet signs payments directly and the worker writes results with an ops key.</text>
</svg>
