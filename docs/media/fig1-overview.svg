<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a7a7a"/>
    </marker>
  </defs>
  <rect width="1000" height="400" fill="#ffffff"/>

  <!-- region labels -->
  <rect x="16" y="20" width="738" height="290" rx="6" fill="#f6f8fb" stroke="#c9d3e0" stroke-dasharray="5 4"/>
  <text x="30" y="42" font-size="13" fill="#4a5a70" font-weight="bold" letter-spacing="1">OFFCHAIN · GAMEPLAY</text>
  <rect x="770" y="20" width="214" height="290" rx="6" fill="#f7f5fc" stroke="#d3cbe8" stroke-dasharray="5 4"/>
  <text x="784" y="42" font-size="13" fill="#5b4a85" font-weight="bold" letter-spacing="1">ONCHAIN · NEAR</text>

  <!-- (a) strategy -->
  <rect x="36" y="70" width="160" height="150" rx="5" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
  <text x="48" y="92" font-size="13" font-weight="bold">(a) Strategy</text>
  <text x="48" y="116" font-size="12" fill="#333">Plain-language skill</text>
  <text x="48" y="134" font-size="12" fill="#333">written by a player</text>
  <rect x="48" y="148" width="136" height="54" rx="3" fill="#fbfbf6" stroke="#b5b5a5"/>
  <text x="56" y="166" font-size="10.5" font-style="italic" fill="#555">"Find the one gap the</text>
  <text x="56" y="180" font-size="10.5" font-style="italic" fill="#555">water needs and block</text>
  <text x="56" y="194" font-size="10.5" font-style="italic" fill="#555">it first."</text>

  <!-- (b) crew -->
  <rect x="226" y="70" width="150" height="150" rx="5" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
  <text x="238" y="92" font-size="13" font-weight="bold">(b) Crew</text>
  <text x="238" y="116" font-size="12" fill="#333">1–3 agents, each with</text>
  <text x="238" y="134" font-size="12" fill="#333">a role and ≤ 3 skills</text>
  <g fill="#e8f1fb" stroke="#4a6fa5">
    <rect x="244" y="152" width="34" height="34" rx="3"/>
    <rect x="284" y="152" width="34" height="34" rx="3"/>
    <rect x="324" y="152" width="34" height="34" rx="3"/>
  </g>
  <g font-size="10" text-anchor="middle" fill="#2c4a75">
    <text x="261" y="173">A₁</text><text x="301" y="173">A₂</text><text x="341" y="173">A₃</text>
  </g>
  <text x="238" y="208" font-size="10.5" fill="#666">skills sealed (encrypted)</text>

  <!-- (c) match -->
  <rect x="406" y="70" width="168" height="150" rx="5" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
  <text x="418" y="92" font-size="13" font-weight="bold">(c) Match</text>
  <text x="562" y="92" font-size="10.5" fill="#888" text-anchor="end">Fig. 2</text>
  <text x="418" y="116" font-size="12" fill="#333">Two crews, one shared</text>
  <text x="418" y="134" font-size="12" fill="#333">map, t = 1 … 150 ticks</text>
  <!-- tiny map -->
  <g stroke="#9aa7b8" stroke-width="0.6">
    <rect x="420" y="146" width="140" height="62" fill="#f3f5f8"/>
    <line x1="490" y1="146" x2="490" y2="208" stroke-dasharray="3 3"/>
  </g>
  <rect x="430" y="186" width="40" height="14" fill="#cfe3f7" stroke="#7aa6d6" stroke-width="0.6"/>
  <text x="434" y="197" font-size="8.5" fill="#3d6a99">water</text>
  <circle cx="452" cy="162" r="5" fill="#2a9d8f"/><circle cx="466" cy="170" r="5" fill="#2a9d8f"/>
  <circle cx="528" cy="162" r="5" fill="#e76f51"/><circle cx="514" cy="172" r="5" fill="#e76f51"/>

  <!-- (d) result -->
  <rect x="604" y="70" width="136" height="150" rx="5" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
  <text x="616" y="92" font-size="13" font-weight="bold">(d) Result</text>
  <text x="616" y="116" font-size="12" fill="#333">Winner, score and</text>
  <text x="616" y="134" font-size="12" fill="#333">a log hash hₜ</text>
  <rect x="616" y="150" width="112" height="22" rx="3" fill="#f4f4f4" stroke="#bbb"/>
  <text x="622" y="165" font-size="10" font-family="Courier New, monospace" fill="#444">h = 5cc0…2f9a</text>
  <text x="616" y="194" font-size="10.5" fill="#666">debrief: per-tick</text>
  <text x="616" y="208" font-size="10.5" fill="#666">"why did it do that?"</text>

  <!-- (e) onchain -->
  <rect x="790" y="70" width="176" height="62" rx="5" fill="#ffffff" stroke="#5b4a85" stroke-width="1.2"/>
  <text x="802" y="92" font-size="13" font-weight="bold" fill="#3f3266">(e) Mint &amp; trade</text>
  <text x="802" y="112" font-size="11.5" fill="#333">skill → NFT (NEP-171)</text>
  <text x="802" y="126" font-size="11.5" fill="#333">use rights, never the text</text>
  <rect x="790" y="158" width="176" height="62" rx="5" fill="#ffffff" stroke="#5b4a85" stroke-width="1.2"/>
  <text x="802" y="180" font-size="13" font-weight="bold" fill="#3f3266">(f) Record &amp; reward</text>
  <text x="802" y="200" font-size="11.5" fill="#333">ranked h and Elo in registry</text>
  <text x="802" y="214" font-size="11.5" fill="#333">royalties · season pools</text>

  <!-- arrows -->
  <g stroke="#333" stroke-width="1.3" fill="none" marker-end="url(#ar)">
    <line x1="196" y1="145" x2="224" y2="145"/>
    <line x1="376" y1="145" x2="404" y2="145"/>
    <line x1="574" y1="145" x2="602" y2="145"/>
    <path d="M740,120 C 760,110 770,101 788,101"/>
    <path d="M740,170 C 760,180 770,189 788,189"/>
  </g>
  <!-- iterate loop -->
  <path d="M672,222 C 672,256 116,256 116,224" stroke="#7a7a7a" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#arg)"/>
  <text x="394" y="284" font-size="11.5" font-style="italic" fill="#666" text-anchor="middle">iterate: refine the strategy from the debrief and benchmarks</text>

  <!-- caption -->
  <text x="16" y="342" font-size="13.5" fill="#222"><tspan font-weight="bold">Figure 1.</tspan> Overview of skirm. Players author strategies (a) that AI agents execute (b–c);</text>
  <text x="16" y="362" font-size="13.5" fill="#222">every match yields a verifiable log hash (d). Ownership, trades and ranked results settle on NEAR (e–f),</text>
  <text x="16" y="382" font-size="13.5" fill="#222">while gameplay and strategy text stay offchain.</text>
</svg>
